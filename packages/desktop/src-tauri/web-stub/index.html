<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode (Tauri shell)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #e6edf3; font-family: Segoe UI, sans-serif; }
      #bar { height: 40px; display: flex; align-items: center; padding: 0 12px; background: linear-gradient(90deg, #7c3aed, #db2777); font-weight: 600; user-select: none; }
      #body { padding: 24px; font-size: 14px; line-height: 1.6; }
      code { background: #21262d; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="bar" data-tauri-drag-region>OpenCode / Tauri shell (stub)</div>
    <div id="body">
      <p>Renderer not wired yet. This stub exists so the Tauri window, the sidecar bootstrap and
      the deep-link/single-instance plumbing can be validated before the real UI is connected.</p>
      <p>Waiting for the local server…</p>
    </div>
    <script type="module">
      // The window title doubles as an out-of-band status channel: the shell reads
      // it from the OS when there is no console attached to the webview.
      const setTitle = (text) => {
        document.title = text
      }
      const invoke = window.__TAURI__?.core?.invoke
      const out = {}

      try {
        setTitle("stub:start")
        if (!invoke) throw new Error("window.__TAURI__.core.invoke missing")

        try {
          out.server = await invoke("await_initialization")
          setTitle("stub:server-ok")
        } catch (error) {
          out.server_error = String(error)
        }

        try {
          await invoke("store_set", { name: "opencode.settings", key: "p1.probe", value: "ok" })
          out.store_get = await invoke("store_get", { name: "opencode.settings", key: "p1.probe" })
          out.store_keys = await invoke("store_keys", { name: "opencode.settings" })
          out.store_length = await invoke("store_length", { name: "opencode.settings" })
          await invoke("store_delete", { name: "opencode.settings", key: "p1.probe" })
        } catch (error) {
          out.store_error = String(error)
        }

        try {
          out.window_id = await invoke("get_window_id")
        } catch (error) {
          out.window_id_error = String(error)
        }

        try {
          out.deep_links = await invoke("consume_initial_deep_links")
        } catch (error) {
          out.deep_links_error = String(error)
        }

        await invoke("log_stub", { message: JSON.stringify(out) }).catch(() => {})
        setTitle(out.server ? "stub:done" : "stub:done-no-server")
      } catch (error) {
        out.fatal = String(error)
        setTitle("stub:fatal " + String(error))
      }

      const lines = Object.entries(out)
        .map(([key, value]) => `<p>${key}: <code>${JSON.stringify(value)}</code></p>`)
        .join("")
      document.querySelector("#body").insertAdjacentHTML("beforeend", lines)
    </script>
  </body>
</html>
