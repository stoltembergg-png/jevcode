<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode (Tauri shell)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #101418; color: #e6edf3; font-family: Segoe UI, sans-serif; }
      #bar { height: 40px; display: flex; align-items: center; padding: 0 12px; background: linear-gradient(90deg, #7c3aed, #db2777); font-weight: 600; user-select: none; }
      #body { padding: 24px; font-size: 14px; line-height: 1.6; }
      code { background: #21262d; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="bar" data-tauri-drag-region>OpenCode / Tauri shell (stub)</div>
    <div id="body">
      <p>Renderer not wired yet. This stub exists so the Tauri window, the sidecar bootstrap and
      the deep-link/single-instance plumbing can be validated before the real UI is connected.</p>
      <p>Waiting for the local server…</p>
    </div>
    <script>
      const invoke = window.__TAURI__.core.invoke
      const server = await invoke("await_initialization").catch((error) => ({ error: String(error) }))
      document.querySelector("#body").insertAdjacentHTML(
        "beforeend",
        server.error
          ? `<p>server error: <code>${server.error}</code></p>`
          : `<p>server ready: <code>${server.url}</code></p>`,
      )
    </script>
  </body>
</html>
