<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>p0-probe</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; font-family: Segoe UI, sans-serif; background: #101418; color: #e6edf3; }
      #dragbar {
        height: 40px;
        width: 100%;
        background: linear-gradient(90deg, #7c3aed, #db2777);
        display: flex;
        align-items: center;
        padding: 0 12px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: .3px;
        user-select: none;
      }
      #content { padding: 20px; }
      button { margin: 4px 8px 4px 0; padding: 8px 14px; font-size: 14px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #e6edf3; cursor: pointer; }
      button:hover { background: #30363d; }
      #status { margin-top: 16px; white-space: pre-wrap; font-family: Consolas, monospace; font-size: 13px; color: #7ee787; }
      .box { margin-top: 16px; padding: 12px; border: 1px dashed #30363d; border-radius: 6px; }
    </style>
  </head>
  <body>
    <!-- 40px frameless drag region -->
    <div id="dragbar" data-tauri-drag-region>p0-probe / drag me (data-tauri-drag-region)</div>
    <div id="content">
      <div class="box">
        <strong>Zoom</strong><br />
        This text and the box should visibly scale when zoom changes.
        <div id="ruler" style="margin-top:8px;height:24px;width:300px;background:#1f6feb;"></div>
      </div>
      <div style="margin-top:16px">
        <button data-factor="1">zoom 100%</button>
        <button data-factor="1.25">zoom 125%</button>
        <button data-factor="1.5">zoom 150%</button>
      </div>
      <div style="margin-top:16px">
        <button id="spawn">spawn sidecar + health</button>
      </div>
      <div id="status">ready</div>
    </div>

    <script>
      const invoke = window.__TAURI__.core.invoke;
      const status = (msg) => {
        document.getElementById("status").textContent += "\n" + msg;
      };

      async function applyZoom(factor) {
        const result = await invoke("set_zoom", { factor });
        const dpr = window.devicePixelRatio;
        await invoke("zoom_readback", { dpr });
        status(`set_zoom(${factor}) -> ${result}; devicePixelRatio=${dpr}`);
      }

      // Used by the automated Rust probe for a JS-side readback.
      window.__probeReadDpr = () => {
        invoke("zoom_readback", { dpr: window.devicePixelRatio }).catch(() => {});
      };

      for (const button of document.querySelectorAll("button[data-factor]")) {
        button.addEventListener("click", () => applyZoom(Number(button.dataset.factor)));
      }

      document.getElementById("spawn").addEventListener("click", async () => {
        try {
          status("spawning: " + (await invoke("spawn_sidecar")));
        } catch (error) {
          status("spawn failed: " + error);
        }
        try {
          status("health: " + (await invoke("health_check")));
        } catch (error) {
          status("health failed: " + error);
        }
      });
    </script>
  </body>
</html>
