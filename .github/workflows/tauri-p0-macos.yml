name: tauri-p0-macos

# P0 spike: run the Tauri probe on macOS to validate WKWebView behaviour that
# cannot be checked on Windows (native zoom, frameless window, sidecar spawn).
# See artifacts/tauri-p0-probe and specs/tauri-migration.md.

on:
  workflow_dispatch:

concurrency:
  group: tauri-p0-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: artifacts/tauri-p0-probe/src-tauri

      - name: Build the opencode sidecar for macOS
        working-directory: packages/opencode
        run: bun run build --single --skip-embed-web-ui

      - name: Stage the sidecar for externalBin
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          case "$(uname -m)" in
            arm64) PLATFORM=opencode-darwin-arm64 ;;
            x86_64) PLATFORM=opencode-darwin-x64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          BIN="packages/opencode/dist/${PLATFORM}/bin/opencode"
          test -f "$BIN"
          mkdir -p artifacts/tauri-p0-probe/src-tauri/binaries
          cp "$BIN" "artifacts/tauri-p0-probe/src-tauri/binaries/opencode-cli-${TRIPLE}"
          ls -l artifacts/tauri-p0-probe/src-tauri/binaries

      - name: Build the probe
        working-directory: artifacts/tauri-p0-probe/src-tauri
        run: cargo build

      - name: Run the probe
        working-directory: artifacts/tauri-p0-probe/src-tauri
        env:
          PROBE_REPORT: ${{ github.workspace }}/tauri-p0-report.json
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) PLATFORM=opencode-darwin-arm64 ;;
            x86_64) PLATFORM=opencode-darwin-x64 ;;
            *) echo "unsupported arch $(uname -m)"; exit 1 ;;
          esac
          export PROBE_OPENCODE_BIN="$GITHUB_WORKSPACE/packages/opencode/dist/${PLATFORM}/bin/opencode"
          ./target/debug/p0-tauri-probe 2>&1 | tee probe-run.log
          echo "=== report ==="
          cat "$PROBE_REPORT"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-p0-macos-report
          path: |
            tauri-p0-report.json
            artifacts/tauri-p0-probe/src-tauri/probe-run.log
          if-no-files-found: warn
