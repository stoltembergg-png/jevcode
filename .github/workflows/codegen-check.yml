name: codegen-check

# Guards the generated HTTP clients against drift: `check:generated` regenerates them
# from the local protocol and fails if the committed files change. Cheap (no Rust, no
# sidecar) and it runs exactly when the contract can change.

on:
  workflow_dispatch:
  push:
    branches: [tauri-shell]
    paths:
      - "packages/client/**"
      - "packages/server/**"
      - "packages/protocol/**"
      - "packages/schema/**"
      - "packages/httpapi-codegen/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/codegen-check.yml"

concurrency:
  group: codegen-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generated:
    # Pin 24.04: ubuntu-latest migrates to 26.04 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Check the generated clients are in sync
        run: bun run --cwd packages/client check:generated
