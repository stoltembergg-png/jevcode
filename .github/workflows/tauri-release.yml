name: tauri-release

# Builds the Tauri desktop bundle and (optionally) publishes a GitHub release with
# updater artifacts. Everything signing-related degrades gracefully: without the
# secrets the workflow still produces unsigned installers, and signing switches on
# by itself once the credentials exist (see specs/tauri-migration.md, "P4 prerequisites").
#
# The NextCode sidecar is cross-compiled once on Ubuntu: building
# it natively on Windows trips Bun's lifecycle shim for tree-sitter-powershell, which
# expects a node-gyp at the project root that the pinned Bun does not provide.
#
# Secret names (all optional):
#   Updater:  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   Windows:  AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID,
#             AZURE_TRUSTED_SIGNING_ENDPOINT, AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
#             AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE
#   macOS:    APPLE_CERTIFICATE (base64 p12), APPLE_CERTIFICATE_PASSWORD,
#             APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY,
#             APPLE_API_KEY_CONTENTS (contents of the .p8)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0 or 0.1.0-beta.1). Defaults to 0.0.0."
        required: false
        default: "0.0.0"
      channel:
        description: "Release channel: prod feeds latest.json; beta feeds beta.json and marks the release as a pre-release"
        required: false
        type: choice
        options: ["prod", "beta"]
        default: "prod"
      publish:
        description: "Publish a GitHub release with the built artifacts"
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sidecar:
    # Pin 24.04: ubuntu-latest migrates to 26.04 from 19 Oct 2026.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Build the opencode sidecar (cross-compiled)
        working-directory: packages/opencode
        env:
          OPENCODE_CHANNEL: ${{ inputs.channel || 'prod' }}
        run: bun run build --skip-embed-web-ui --targets=opencode-windows-x64,opencode-darwin-arm64

      - uses: actions/upload-artifact@v6
        with:
          name: opencode-sidecar
          path: packages/opencode/dist/

  # Upstream deletes old llama.cpp nightlies, so the vendored archive is mirrored
  # onto a durable release before the platform builds run. The pin lives in
  # packages/opencode/script/semif-server.lock.json; the fetch script verifies
  # bytes and sha256 on the way in and is a no-op when the mirror already has it.
  mirror:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install

      - name: Resolve the vendored llama.cpp pin
        id: plan
        run: |
          set -euo pipefail
          echo "tag=$(bun -e "console.log(require('./packages/opencode/script/semif-server.lock.json').tag)")" >> "$GITHUB_OUTPUT"

      - name: Download and verify the llama.cpp archives
        env:
          PIN: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          MIRROR_TAG="semif-server-${PIN}"
          for TARGET in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            case "$TARGET" in
              *apple-darwin) EXT=.tar.gz ;;
              *) EXT=.zip ;;
            esac
            export NEXTCODE_SEMIF_MIRROR="https://github.com/${{ github.repository }}/releases/download/${MIRROR_TAG}/semif-server-${PIN}-${TARGET}${EXT}"
            bun packages/opencode/script/fetch-semif-server.ts --target "$TARGET" --download-only
          done

      - name: Publish the mirrored archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PIN: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          MIRROR_TAG="semif-server-${PIN}"
          NOTES="Mirrored llama.cpp ${PIN} server binaries (upstream nightlies are ephemeral)."
          if gh release view "$MIRROR_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$MIRROR_TAG" --repo "${{ github.repository }}" --notes "$NOTES" --prerelease
          else
            gh release create "$MIRROR_TAG" --repo "${{ github.repository }}" --title "$MIRROR_TAG" --notes "$NOTES" --target "$GITHUB_SHA" --prerelease
          fi
          LOCK="packages/opencode/script/semif-server.lock.json"
          for TARGET in x86_64-pc-windows-msvc aarch64-apple-darwin x86_64-apple-darwin; do
            ASSET=$(bun -e "console.log(require('./${LOCK}').targets['${TARGET}'].asset)")
            case "$ASSET" in
              *.tar.gz) EXT=.tar.gz ;;
              *) EXT=.zip ;;
            esac
            NAME="semif-server-${PIN}-${TARGET}${EXT}"
            cp "packages/desktop/src-tauri/.semif-cache/${ASSET}" "/tmp/${NAME}"
            gh release upload "$MIRROR_TAG" "/tmp/${NAME}" --clobber --repo "${{ github.repository }}"
          done

  build:
    needs: [sidecar, mirror]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      HAS_AZURE: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' }}
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v5

      # Explicit bun setup instead of the composite action: on Windows Bun's
      # patched-dependency cache rename fails with ENOTEMPTY (oven-sh/bun#28147),
      # so Windows installs with --no-cache + hoisted linker.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Windows" ]; then
            # Bun's patched-dependency cache rename is racy on Windows
            # (oven-sh/bun#28147, ENOTEMPTY while applying patchfiles), so a cleared
            # cache plus a bounded retry is the reliable combination.
            ok=0
            for attempt in 1 2 3; do
              bun pm cache rm || true
              if bun install --linker hoisted; then ok=1; break; fi
              echo "bun install attempt $attempt failed; retrying"
              sleep 5
            done
            [ "$ok" = "1" ] || exit 1
          else
            bun install
          fi

      - name: Resolve the release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
            case "$VERSION" in *beta*) CHANNEL="beta";; *) CHANNEL="prod";; esac
          else
            VERSION="${INPUT_VERSION:-0.0.0}"
            TAG="v${VERSION}"
            case "$VERSION" in *beta*) CHANNEL="beta";; *) CHANNEL="${INPUT_CHANNEL:-prod}";; esac
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"
          echo "resolved version=$VERSION tag=$TAG channel=$CHANNEL"

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Download the cross-compiled sidecar
        uses: actions/download-artifact@v8
        with:
          name: opencode-sidecar
          path: packages/opencode/dist

      - name: Stage the sidecar for externalBin
        shell: bash
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p packages/desktop/src-tauri/binaries
          case "$RUNNER_OS" in
            Windows)
              cp packages/opencode/dist/opencode-windows-x64/bin/opencode.exe \
                 "packages/desktop/src-tauri/binaries/opencode-cli-${TRIPLE}.exe"
              ;;
            macOS)
              case "$(uname -m)" in
                arm64) PLATFORM=opencode-darwin-arm64 ;;
                x86_64) PLATFORM=opencode-darwin-x64 ;;
                *) echo "unsupported arch"; exit 1 ;;
              esac
              cp "packages/opencode/dist/${PLATFORM}/bin/opencode" \
                 "packages/desktop/src-tauri/binaries/opencode-cli-${TRIPLE}"
              # Artifact downloads drop the executable bit.
              chmod +x "packages/desktop/src-tauri/binaries/opencode-cli-${TRIPLE}"
              ;;
            *) echo "unsupported runner"; exit 1 ;;
          esac
          ls -l packages/desktop/src-tauri/binaries

      - name: Vendor the llama-server runtime
        shell: bash
        env:
          PIN: ${{ needs.mirror.outputs.tag }}
        run: |
          set -euo pipefail
          TRIPLE=$(rustc -vV | sed -n 's/^host: //p')
          case "$RUNNER_OS" in
            Windows) EXT=.zip ;;
            macOS) EXT=.tar.gz ;;
            *) echo "unsupported runner"; exit 1 ;;
          esac
          export NEXTCODE_SEMIF_MIRROR="https://github.com/${{ github.repository }}/releases/download/semif-server-${PIN}/semif-server-${PIN}-${TRIPLE}${EXT}"
          bun packages/opencode/script/fetch-semif-server.ts --target "$TRIPLE"

      - name: Build the renderer
        working-directory: packages/desktop
        env:
          OPENCODE_CHANNEL: ${{ env.CHANNEL }}
        run: bun run build:renderer-tauri

      - name: Install the Azure signing CLI (Windows, when credentials exist)
        if: env.HAS_AZURE == 'true' && matrix.platform == 'windows-latest'
        run: cargo install artifact-signing-cli --locked

      - name: Import the Apple certificate (macOS, when credentials exist)
        if: env.HAS_APPLE == 'true' && matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Write the CI Tauri config
        shell: bash
        env:
          CHANNEL: ${{ env.CHANNEL }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const channel = process.env.CHANNEL || "prod";
            const createUpdaterArtifacts = process.env.HAS_UPDATER_KEY === "true";
            const updaterEndpoints = channel === "beta"
              ? ["https://github.com/stoltembergg-png/nextcode/releases/download/beta/beta.json"]
              : ["https://github.com/stoltembergg-png/nextcode/releases/latest/download/latest.json"];
            const config = { version, bundle: { createUpdaterArtifacts }, plugins: { updater: { endpoints: updaterEndpoints } } };
            const azureReady = process.env.HAS_AZURE === "true" && process.env.RUNNER_OS === "Windows";
            if (azureReady) {
              const e = process.env.AZURE_TRUSTED_SIGNING_ENDPOINT;
              const a = process.env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME;
              const c = process.env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE;
              config.bundle.windows = { signCommand: `artifact-signing-cli -e ${e} -a ${a} -c ${c} -d NextCode %1` };
            }
            fs.writeFileSync("src-tauri/tauri.ci.conf.json", JSON.stringify(config, null, 2));
            console.log(fs.readFileSync("src-tauri/tauri.ci.conf.json", "utf8"));
          '
        working-directory: packages/desktop

      - name: Build the bundle
        working-directory: packages/desktop
        shell: bash
        env:
          OPENCODE_CHANNEL: ${{ env.CHANNEL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY_CONTENTS }}
        run: |
          set -euo pipefail
          if [ "${HAS_APPLE:-false}" = "true" ]; then
            printf '%s' "${APPLE_API_KEY_CONTENTS:-}" > "$APPLE_API_KEY_PATH"
          else
            # Without credentials Tauri still tries to notarize (the env vars are set)
            # and fails on the missing .p8; drop them and sign ad-hoc instead.
            unset APPLE_API_ISSUER APPLE_API_KEY APPLE_API_KEY_PATH APPLE_API_KEY_CONTENTS APPLE_SIGNING_IDENTITY
            export APPLE_SIGNING_IDENTITY="-"
          fi
          bun run tauri build --config src-tauri/tauri.ci.conf.json --bundles "${{ matrix.bundles }}"

      # Packaging smoke test for the vendored SemIf runtime. The .app produced by
      # the `app` bundle target must carry the launcher at Contents/MacOS/llama-server
      # and its dylibs at Contents/Resources/semif (see main.rs `semif_sidecar_env`),
      # and the launcher must actually start under the loader. This is the only place
      # that validates the packaged contract before promoting to stable.
      - name: Smoke-test the packaged macOS bundle (llama-server loader)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # The bundle dir is the one the Collect step and swatinem/rust-cache use:
          # packages/desktop/src-tauri/target/release/bundle. Tauri writes the `app`
          # target to bundle/macos/<productName>.app (productName = NextCode).
          BUNDLE="packages/desktop/src-tauri/target/release/bundle/macos"
          APP=$(find "$BUNDLE" -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "FAIL: no .app bundle under $BUNDLE"
            ls -la "$BUNDLE" 2>/dev/null || true
            exit 1
          fi
          echo "app bundle: $APP"

          SERVER="$APP/Contents/MacOS/llama-server"
          LIBS="$APP/Contents/Resources/semif"
          if [ ! -f "$SERVER" ]; then
            echo "FAIL: missing $SERVER"
            ls -la "$APP/Contents/MacOS" 2>/dev/null || true
            exit 1
          fi
          if [ ! -x "$SERVER" ]; then
            echo "FAIL: $SERVER is not executable"
            exit 1
          fi
          if [ ! -d "$LIBS" ]; then
            echo "FAIL: missing $LIBS"
            ls -la "$APP/Contents/Resources" 2>/dev/null || true
            exit 1
          fi

          echo "=== Contents/MacOS ==="
          ls -la "$APP/Contents/MacOS"
          echo "=== Contents/Resources/semif ==="
          ls -la "$LIBS"
          DYLIBS=$(find "$LIBS" -maxdepth 1 -type f -name "*.dylib" | wc -l | tr -d ' ')
          echo "dylib count: $DYLIBS"
          if [ "$DYLIBS" -eq 0 ]; then
            echo "FAIL: no dylibs staged in $LIBS"
            exit 1
          fi

          # Run the launcher exactly like the app does at runtime: the same
          # DYLD_FALLBACK_LIBRARY_PATH the shell hands the sidecar. --help needs no
          # model and still forces dyld to resolve every linked dylib at startup.
          echo "=== loader smoke: llama-server --help ==="
          set +e
          OUT=$(DYLD_FALLBACK_LIBRARY_PATH="$LIBS" "$SERVER" --help 2>&1)
          CODE=$?
          set -e
          printf '%s\n' "$OUT"
          echo "exit code: $CODE"

          FAIL=0
          case "$OUT" in
            *"Library not loaded"*|*"dyld:"*|*"image not found"*)
              echo "FAIL: dyld could not start the bundled llama-server"
              FAIL=1
              ;;
          esac
          # 126/127 mean the loader could not execute it; >=128 is a fatal signal.
          if [ "$CODE" -eq 126 ] || [ "$CODE" -eq 127 ] || [ "$CODE" -ge 128 ]; then
            echo "FAIL: llama-server did not run to completion (exit $CODE)"
            FAIL=1
          fi
          if [ "$CODE" -eq 0 ] && ! printf '%s' "$OUT" | grep -qi "usage"; then
            echo "WARN: --help exited 0 but printed no usage text"
          fi
          exit "$FAIL"

      # Best-effort, non-blocking: reports the .app signature state. Real
      # signing/notarization only happen when the Apple secrets are present, so a
      # failure here is informational, not a release gate.
      - name: Report the macOS bundle signature state
        if: always() && matrix.platform == 'macos-latest'
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BUNDLE="packages/desktop/src-tauri/target/release/bundle/macos"
          APP=$(find "$BUNDLE" -maxdepth 1 -type d -name "*.app" -print -quit 2>/dev/null)
          if [ -z "$APP" ]; then
            echo "no .app bundle found under $BUNDLE; skipping codesign report"
            exit 0
          fi
          echo "codesign verify: $APP"
          codesign --verify --deep --strict --verbose=2 "$APP" \
            || echo "WARN: codesign --verify reported issues (unsigned/notarization is out of scope for this pipeline)"
          codesign -dv --verbose=4 "$APP" 2>&1 || true

      - name: Collect artifacts and the updater fragment
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE="packages/desktop/src-tauri/target/release/bundle"
          OUT="dist-release"
          mkdir -p "$OUT"
          find "$BUNDLE" -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.AppImage" -o -name "*.sig" \) -exec cp {} "$OUT/" \;
          ls -l "$OUT"
          PLATFORM_KEY=""
          ARTIFACT=""
          case "$RUNNER_OS" in
            Windows) PLATFORM_KEY="windows-x86_64"; ARTIFACT=$(basename "$(ls "$OUT"/*setup.exe)") ;;
            # The macOS updater consumes the .app.tar.gz (the .dmg is for manual installs).
            macOS) PLATFORM_KEY="darwin-aarch64"; ARTIFACT=$(basename "$(ls "$OUT"/*.app.tar.gz)") ;;
          esac
          if [ -f "$OUT/${ARTIFACT}.sig" ]; then
            export VERSION PLATFORM_KEY
            export URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$ARTIFACT"
            export SIG="$(cat "$OUT/${ARTIFACT}.sig")"
            node -e '
              const fs = require("fs");
              const fragment = {
                version: process.env.VERSION,
                notes: "",
                pub_date: new Date().toISOString(),
                platforms: { [process.env.PLATFORM_KEY]: { url: process.env.URL, signature: process.env.SIG } },
              };
              const path = `dist-release/latest-fragment-${process.env.PLATFORM_KEY}.json`;
              fs.writeFileSync(path, JSON.stringify(fragment, null, 2));
              console.log(fs.readFileSync(path, "utf8"));
            '
          else
            echo "no .sig produced (updater key missing): skipping the latest.json fragment"
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tauri-release-${{ matrix.platform }}
          path: dist-release/
          if-no-files-found: warn

  release:
    needs: [sidecar, build]
    if: (inputs.publish || github.ref_type == 'tag') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The release job has no checkout of its own; the changelog step needs tags,
      # so fetch the full history instead of the shallow default.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve the release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version || '' }}
          INPUT_CHANNEL: ${{ inputs.channel || '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            case "$TAG" in *beta*) CHANNEL="beta";; *) CHANNEL="prod";; esac
          else
            TAG="v${INPUT_VERSION:-0.0.0}"
            case "$INPUT_VERSION" in *beta*) CHANNEL="beta";; *) CHANNEL="prod";; esac
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      # Group commit subjects between the previous release tag and $TAG by
      # conventional-commit type. Never fatal: an empty release-notes.md means
      # "publish without notes", so every git/node failure is swallowed.
      - name: Compute the changelog
        shell: bash
        run: |
          set -uo pipefail
          : > release-notes.md
          PREV=""
          if git rev-parse --verify --quiet "${TAG}^{commit}" >/dev/null 2>&1; then
            PREV=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          fi
          # No earlier tag (or an unknown dispatch tag): show the last 50 commits.
          if [ -n "$PREV" ]; then RANGE="${PREV}..${TAG}"; else RANGE="-50"; fi
          git log --no-merges --format='%s' "$RANGE" > changelog-raw.txt 2>/dev/null || true
          node -e '
            const fs = require("fs");
            const raw = fs.existsSync("changelog-raw.txt") ? fs.readFileSync("changelog-raw.txt", "utf8") : "";
            const noise = /^(chore(\([^)]*\))?:\s*(release|bump|version)|merge\b|v?\d+\.\d+\.\d+\s*$)/i;
            const groups = { "Features": [], "Fixes": [], "Other": [] };
            const seen = new Set();
            for (const line of raw.split("\n").map((s) => s.trim()).filter(Boolean)) {
              if (noise.test(line)) continue;
              const key = line.toLowerCase();
              if (seen.has(key)) continue;
              seen.add(key);
              const match = line.match(/^([a-z]+)(?:\([^)]*\))?!?:\s*/i);
              const type = match ? match[1].toLowerCase() : "";
              if (type === "feat") groups["Features"].push(line);
              else if (type === "fix") groups["Fixes"].push(line);
              else if (groups["Other"].length < 5) groups["Other"].push(line);
            }
            const out = [];
            for (const [title, items] of Object.entries(groups)) {
              if (items.length === 0) continue;
              out.push(`### ${title}`, ...items.map((item) => `- ${item}`), "");
            }
            if (out.length === 0) out.push("No notable changes.");
            fs.writeFileSync("release-notes.md", out.slice(0, 30).join("\n").trim() + "\n");
            console.log(fs.readFileSync("release-notes.md", "utf8"));
          ' || echo "changelog generation failed; publishing without notes"

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # The updater reads a single `latest.json`; the build jobs emit one fragment
      # per platform (only when the updater key produced a .sig).
      - name: Merge the updater fragments into latest.json
        working-directory: artifacts
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");
            const walk = (dir) => fs.readdirSync(dir, { withFileTypes: true }).flatMap((entry) => {
              const full = path.join(dir, entry.name);
              return entry.isDirectory() ? walk(full) : [full];
            });
            const files = walk(".").filter((file) => path.basename(file).startsWith("latest-fragment-") && file.endsWith(".json"));
            if (files.length === 0) {
              console.log("no updater fragments (the key was missing): keeping the release without latest.json");
            } else {
              const notesPath = path.join("..", "release-notes.md");
              const notes = fs.existsSync(notesPath) ? fs.readFileSync(notesPath, "utf8").trim() : "";
              const merged = { version: "", notes, pub_date: new Date().toISOString(), platforms: {} };
              for (const file of files) {
                const fragment = JSON.parse(fs.readFileSync(file, "utf8"));
                merged.version = merged.version || fragment.version;
                merged.pub_date = fragment.pub_date;
                Object.assign(merged.platforms, fragment.platforms);
              }
              const feedName = (process.env.CHANNEL || "prod") === "beta" ? "beta.json" : "latest.json";
              fs.writeFileSync(feedName, JSON.stringify(merged, null, 2));
              console.log(fs.readFileSync(feedName, "utf8"));
            }
          '

      - name: Publish to the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the heading, then append the changelog when it was generated.
          {
            echo "NextCode $TAG"
            if [ -s release-notes.md ]; then
              echo
              cat release-notes.md
            fi
          } > gh-release-body.md
          # Beta-channel releases are pre-releases so stable users never see them.
          PRERELEASE=""
          if [ "$CHANNEL" = "beta" ]; then PRERELEASE="--prerelease"; fi
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes-file gh-release-body.md $PRERELEASE
          else
            TARGET=""
            if [ "$GITHUB_REF_TYPE" != "tag" ]; then TARGET="--target=$GITHUB_SHA"; fi
            gh release create "$TAG" --repo "${{ github.repository }}" --title "$TAG" --notes-file gh-release-body.md $TARGET $PRERELEASE
          fi
          # Only the platform bundles and the merged feed: the sidecar artifact is internal.
          find artifacts/tauri-release-* -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.sig" \) -print0 |
            xargs -0 -r gh release upload "$TAG" --clobber --repo "${{ github.repository }}"
          if [ -f artifacts/latest.json ]; then
            gh release upload "$TAG" artifacts/latest.json --clobber --repo "${{ github.repository }}"
          fi
          if [ -f artifacts/beta.json ]; then
            # Beta-channel apps resolve the fixed URL `releases/download/beta/beta.json`,
            # so the rolling `beta` release must always carry the current feed.
            if gh release view beta --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release edit beta --repo "${{ github.repository }}" --notes "Beta update feed"
            else
              gh release create beta --repo "${{ github.repository }}" --title "beta" --notes "Beta update feed" --target "$GITHUB_SHA" --prerelease
            fi
            gh release upload beta artifacts/beta.json --clobber --repo "${{ github.repository }}"
            git tag -f beta "$GITHUB_SHA" 2>/dev/null || true
            git push -f origin beta --quiet 2>/dev/null || true
          else
            echo "no beta.json to upload (prod channel)"
          fi
